<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heron.AI 手机预览</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: light-dark(#eef0f3, #17191c); color: light-dark(#20252b, #e6e9ed); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid light-dark(#d4d8dd, #363b42); }
  strong { margin-right: 8px; }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid light-dark(#c7ccd2, #505760); border-radius: 6px; background: light-dark(#fff, #282d33); color: inherit; }
  output { opacity: .7; font-variant-numeric: tabular-nums; }
  main { flex: 1; min-height: 0; padding: 16px; display: flex; justify-content: center; overflow: auto; }
  iframe { flex: none; width: 390px; height: 844px; border: 0; outline: 1px solid light-dark(#ccd1d8, #444b55); background: white; }
  main.desktop iframe { width: 100%; height: 100%; }
</style>
<header>
  <strong>Heron.AI 手机预览</strong>
  <label>视口 <select id="size"><option value="360,800">手机 · 360 × 800</option><option value="390,844" selected>手机 · 390 × 844</option><option value="430,932">手机 · 430 × 932</option><option value="desktop">桌面</option></select></label>
  <button id="reload" type="button">刷新页面</button>
  <output id="dimensions" aria-live="polite"></output>
</header>
<main><iframe title="Heron.AI 实时预览" allow="clipboard-read; clipboard-write"></iframe></main>
<script>
  const frame = document.querySelector('iframe')
  const main = document.querySelector('main')
  const size = document.querySelector('#size')
  // Authentication belongs to the product inside the frame. Remove the launch
  // query from this wrapper once the frame has received it.
  frame.src = '/' + location.search
  history.replaceState(null, '', location.pathname)
  size.addEventListener('change', () => {
    const desktop = size.value === 'desktop'
    main.classList.toggle('desktop', desktop)
    const [width, height] = size.value.split(',')
    frame.style.width = desktop ? '' : width + 'px'
    frame.style.height = desktop ? '' : height + 'px'
  })
  document.querySelector('#reload').addEventListener('click', () => frame.contentWindow.location.reload())
  new ResizeObserver(() => {
    document.querySelector('#dimensions').textContent = `${frame.clientWidth} × ${frame.clientHeight} CSS px`
  }).observe(frame)
</script>
</html>
