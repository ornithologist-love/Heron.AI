packages:
  - packages/common/*
  - scripts/dsh-build
  - packages/community/*
  - packages/dsh
  - packages/dsh/vendor/*
  - packages/dsh/packages/*/*
  - packages/dsh/native/system
  - packages/dsh/native/system/packages/*
  - packages/dsh/apps/*
  - packages/dsh/benchmarks
  - packages/dsh/website
  - packages/dsh/python/sdk-runtime
linkWorkspacePackages: true
preferWorkspacePackages: true
overrides:
  extract-zip>yauzl: 3.4.0
  # One cordis runtime: community packages pin their own published cordis, which would split the Context type and runtime.
  '@deepseek-ai/cordis': link:packages/dsh/vendor/cordis
  '@deepseek-ai/cordis-plugin-group': link:packages/dsh/vendor/group
  '@deepseek-ai/cordis-plugin-include': link:packages/dsh/vendor/include
  '@deepseek-ai/cosmokit': link:packages/dsh/vendor/cosmokit
  '@deepseek-ai/schemastery': link:packages/dsh/vendor/schemastery
  '@earendil-works/pi-ai': 1.3.0
  zod@>=4 <5: 4.4.3
peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'
allowBuilds:
  esbuild: true
  lefthook: true
  node-pty: true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  koffi: true
  electron-winstaller: false
  msgpackr-extract: false
  '@deepseek-ai/dsh-subprocess-local@file:packages/dsh/packages/subprocess/subprocess-local': true
minimumReleaseAgeExclude:
  - '@botiverse/oar@0.67.0'
  - '@deepseek-ai/libreoffice-kit@0.1.5'
